# Trois services (trois conteneurs) sur un réseau privé où chacun joint les
# autres par leur NOM : l'API parle à postgres:5432, le client à api:3000.
#
# En développement, on ne démarre que la base :  docker compose up -d postgres
# puis `npm run dev` comme avant ; l'API la joint sur localhost:5432.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quizm9
      POSTGRES_PASSWORD: quizm9
      POSTGRES_DB: quizm9
    ports:
      # 127.0.0.1 : la base n'est joignable que de ce poste, pas du réseau.
      - "127.0.0.1:5432:5432"
    volumes:
      # Les fichiers de la base vivent ici, PAS dans le conteneur : ils
      # survivent à docker compose down, et à la destruction du conteneur.
      - quizm9-pgdata:/var/lib/postgresql/data
    healthcheck:
      # « Prêt » veut dire : accepte des connexions, pas seulement démarré.
      test: ["CMD-SHELL", "pg_isready -U quizm9"]
      interval: 2s
      timeout: 5s
      retries: 15

